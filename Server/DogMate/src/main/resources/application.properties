# =============================================================================
# Local Development Environment (Docker)
# =============================================================================
# 1. docker compose up -d
# 2. ./mvnw spring-boot:run
# Host port 5434 maps to Postgres 5432 inside the container (see docker-compose.yml).
spring.datasource.url=jdbc:postgresql://localhost:5434/dogmate_dev
spring.datasource.username=postgres
spring.datasource.password=dogmate123
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000

# Hibernate — auto-create/update schema from JPA entities on local Postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Seed first local user when Docker DB is empty — set to false after Supabase import
dogmate.local.seed.enabled=false
dogmate.local.seed.email=${DOGMATE_DEV_SEED_EMAIL:dev@dogmate.local}
dogmate.local.seed.password=${DOGMATE_DEV_SEED_PASSWORD:Dogmate123!}
dogmate.local.seed.first-name=${DOGMATE_DEV_SEED_FIRST_NAME:Dev}
dogmate.local.seed.last-name=${DOGMATE_DEV_SEED_LAST_NAME:User}

# H2 Console disabled when using PostgreSQL
spring.h2.console.enabled=false

# JPA/Hibernate Configuration (shared)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Health tables are also created via db/manual/*.sql on startup (ManualDatabaseMigration).
spring.jpa.properties.hibernate.format_sql=true

dogmate.support.email=dogmateteam@gmail.com
# Must match the authenticated SMTP account (same as SPRING_MAIL_USERNAME for Gmail).
dogmate.mail.from=${DOGMATE_MAIL_FROM:dogmateteam@gmail.com}

# --- Outgoing mail (verification codes, etc.) ---
# Set SPRING_MAIL_PASSWORD (Gmail: App Password). Username defaults to DOGMATE_MAIL_FROM so one sender address is enough.
# Gmail: Account security -> 2-Step Verification -> App passwords (not your normal login password).
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:${DOGMATE_MAIL_FROM:dogmateteam@gmail.com}}
spring.mail.password=xarq bcks bckc nkpe
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SMTP_SSL_TRUST:smtp.gmail.com}
