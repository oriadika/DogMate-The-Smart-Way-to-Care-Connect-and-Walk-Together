spring.application.name=DogMate

# H2 Database Configuration - File-based (persistent)
# The database file location depends on working directory:
# - If running from Server/DogMate/: ./data/dogmate_db.mv.db
# - If running from project root: ./data/dogmate_db.mv.db (will be in root/data/)
# DB_CLOSE_DELAY=-1 keeps database open, FILE_LOCK=NO allows multiple connections
spring.datasource.url=jdbc:h2:file:./data/dogmate_db;DB_CLOSE_DELAY=-1;FILE_LOCK=NO
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

# H2 Console (for viewing data in browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
