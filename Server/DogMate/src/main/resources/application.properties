spring.application.name=DogMate

# H2 Database Configuration - File-based (persistent)
# Database will be created in ./data/ directory relative to working directory
# DB_CLOSE_DELAY=-1 keeps database open, FILE_LOCK=NO allows multiple connections
# IMPORTANT: Make sure to run the application from Server/DogMate directory
# Or set working directory to Server/DogMate in your IDE run configuration
spring.datasource.url=jdbc:h2:file:./data/dogmate_db;DB_CLOSE_DELAY=-1;FILE_LOCK=NO
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

# H2 Console (for viewing data in browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
