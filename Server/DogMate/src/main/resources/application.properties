spring.application.name=DogMate

# PostgreSQL (Supabase) Configuration
# Supports overriding credentials through environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.xdaxkncdjhlqlupaxuzd.supabase.co:5432/postgres?sslmode=require}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YuvalGenislav}
spring.datasource.hikari.maximum-pool-size=5

# H2 Console disabled when using PostgreSQL
spring.h2.console.enabled=false

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
