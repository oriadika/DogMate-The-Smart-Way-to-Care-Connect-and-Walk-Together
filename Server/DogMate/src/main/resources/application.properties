spring.application.name=DogMate

# Allow DogMate WebSocket executor beans to replace Spring's default broker pools.
spring.main.allow-bean-definition-overriding=true

# PostgreSQL (Supabase) Configuration
# Use the transaction pooler by default so startup does not exhaust session slots.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.xdaxkncdjhlqlupaxuzd}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YuvalGenislav}
# Pooler 6543 multiplexes clients; tuned for Supabase remote latency and fast fail on pool exhaustion.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=2500
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.keepalive-time=10000

# H2 Console disabled when using PostgreSQL
spring.h2.console.enabled=false

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Creates missing tables/columns from JPA entities. Supabase pooler (6543) may skip DDL —
# health tables are also created via db/manual/*.sql on startup (ManualDatabaseMigration).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

dogmate.support.email=dogmateteam@gmail.com
# Must match the authenticated SMTP account (same as SPRING_MAIL_USERNAME for Gmail).
dogmate.mail.from=${DOGMATE_MAIL_FROM:dogmateteam@gmail.com}

# --- Outgoing mail (verification codes, etc.) ---
# Set SPRING_MAIL_PASSWORD (Gmail: App Password). Username defaults to DOGMATE_MAIL_FROM so one sender address is enough.
# Gmail: Account security -> 2-Step Verification -> App passwords (not your normal login password).
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:${DOGMATE_MAIL_FROM:dogmateteam@gmail.com}}
spring.mail.password=xarq bcks bckc nkpe
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SMTP_SSL_TRUST:smtp.gmail.com}